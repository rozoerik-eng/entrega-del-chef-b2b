name: Deploy LP01 — Restaurantes

on:
  workflow_dispatch:
  push:
    branches:
      - claude/chef-delivery-landing-setup-mqohgh
    paths:
      - landing-restaurantes/**

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout rama de desarrollo
        uses: actions/checkout@v4
        with:
          ref: claude/chef-delivery-landing-setup-mqohgh

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload landing-restaurantes
        uses: actions/upload-pages-artifact@v3
        with:
          path: landing-restaurantes

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
